<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A78B5">
<link rel="manifest" href="manifest.webmanifest">
<script>(function(){var h=location.hash,c=document.documentElement.classList;if(/^#t[1-6]$/.test(h))c.add('cm');else if(h==='#admin')c.add('am')})()</script>
<title>Blue House Café POS v1.0</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Sarabun:wght@400;600;700&display=swap">
<style>
:root{--bg:#ECEAE6;--surf:#FBFAF8;--ink:#1F2326;--mute:#62676B;--line:#D9D6D1;--blue:#0A78B5;--bink:#FFFFFF;--wood:#0A78B5;--free:#2F8F5B;--busy:#B4441F;--soft:#DCEBF5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1215;--surf:#161C21;--ink:#EAEEF1;--mute:#98A3AB;--line:#26303A;--blue:#5DB8EA;--bink:#06202F;--wood:#7CC4EE;--free:#4FBF86;--busy:#E8845F;--soft:#17303F}}
:root[data-theme="dark"]{--bg:#0E1215;--surf:#161C21;--ink:#EAEEF1;--mute:#98A3AB;--line:#26303A;--blue:#5DB8EA;--bink:#06202F;--wood:#7CC4EE;--free:#4FBF86;--busy:#E8845F;--soft:#17303F}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Sarabun,"Noto Sans Thai",system-ui,sans-serif;font-size:16px;user-select:none;-webkit-user-select:none}
button,input{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button{cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--wood);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;background:var(--surf);color:var(--blue);border-bottom:1px solid var(--line)}
.brand b{font-family:"Playfair Display",Georgia,serif;font-size:22px}
.brand small{margin-left:10px;font-size:13px;opacity:.85}
header button{background:transparent;border:1.5px solid currentColor;border-radius:10px;padding:0 14px;min-height:44px}
main{flex:1;min-height:0;display:grid;grid-template-columns:152px 1fr 370px;gap:10px;padding:10px}
.panel{display:flex;flex-direction:column;min-height:0;overflow:hidden;background:var(--surf);border:1px solid var(--line);border-radius:12px}
#tables{display:grid;gap:8px;padding:10px;align-content:start;overflow:auto}
.tb{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:10px 12px;border:1px solid var(--line);border-left:6px solid var(--free);border-radius:10px;background:var(--surf)}
.tb.busy{border-left-color:var(--busy)}
.tb.sel{background:var(--soft);outline:2px solid var(--blue)}
.tb span{font-size:14px;color:var(--mute)}
#cats,#cCats{flex:none;display:flex;gap:8px;padding:10px;overflow-x:auto}
.chip{flex:none;min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line);background:var(--surf)}
.chip.on{background:var(--blue);color:var(--bink);border-color:var(--blue)}
#items,#cItems{flex:1;overflow:auto;padding:0 10px 10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px;align-content:start}
.it{position:relative;min-height:86px;padding:10px;text-align:center;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surf);display:flex;flex-direction:column;justify-content:space-between}
.it small{color:var(--wood);font-weight:700;font-size:15px}
.it i{position:absolute;top:6px;right:6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--blue);color:var(--bink);font-style:normal;font-size:14px;line-height:24px;text-align:center}
#billhead{flex:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
#billhead b{font-size:19px}
.ghost{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:transparent}
#lines{flex:1;overflow:auto;padding:4px 12px}
.ln{display:grid;grid-template-columns:1fr auto 72px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ln small{display:block;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surf);font-size:22px}
.qty b{min-width:22px;text-align:center}
.lt{text-align:right;font-weight:600}
.empty{padding:28px 8px;text-align:center;color:var(--mute)}
#totals{flex:none;display:grid;gap:8px;padding:12px;border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{min-height:40px;padding:0 12px}
.net{font-size:30px;font-weight:700}
.go{min-height:58px;border:0;border-radius:12px;background:var(--blue);color:var(--bink);font-size:20px;font-weight:700;width:100%}
.go:disabled{opacity:.4}
.in{width:100%;min-height:54px;padding:0 12px;font-size:24px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
#cats select,#cats input,#cCats select,#cCats input{min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 12px;font-size:16px}
#cats select,#cCats select{flex:none;font-weight:700}#cats input,#cCats input{flex:1;min-width:0}
input{user-select:text;-webkit-user-select:text}
.hb{display:flex;gap:8px}
#qn{font-style:normal;background:var(--blue);color:var(--bink);border-radius:10px;padding:0 7px;margin-left:6px;font-size:13px}#qn:empty{display:none}
#cust{display:none;flex-direction:column;height:100%}.cm #app{display:none}.cm #cust{display:flex}
#cItems{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));padding-top:10px}
#cBar{flex:none;margin:10px;width:calc(100% - 20px)}
.qrs{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.qc{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#000}
.qq{min-height:150px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:13px}
@media (max-width:899px){header{flex-wrap:wrap;gap:6px}header button{padding:0 10px;font-size:14px;min-height:40px}.brand small{display:none}}
@media (min-width:1400px){
 body{font-size:18px}
 main{grid-template-columns:200px 1fr 470px}
 #items{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
 .it{min-height:108px;font-size:18px}.it small{font-size:17px}
 .tb{min-height:80px}.chip{min-height:50px}.go{min-height:68px}.ln{padding:12px 0}
 .qty button{width:48px;height:48px}.net{font-size:34px}
}
#adm{display:none;flex-direction:column;height:100%}.am #app,.am #cust{display:none}.am #adm{display:flex}
#aBody{flex:1;overflow:auto;padding:10px;max-width:760px;width:100%;margin:0 auto}
.ar{display:flex;align-items:center;gap:10px;width:100%;padding:8px;margin-bottom:6px;border:1px solid var(--line);border-radius:10px;background:var(--surf);text-align:left}
.ar .th{flex:none;width:52px;height:52px;border-radius:8px;background:var(--soft);overflow:hidden}
.ar .th img,.ph2 img{width:100%;height:100%;object-fit:cover;display:block}
.ar .nm{flex:1}.ar b{color:var(--wood)}
.ah{margin:14px 0 6px;color:var(--mute);font-weight:700}
.ph2{height:160px;border-radius:10px;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--mute);overflow:hidden;margin:10px 0}
.fl{display:inline-flex;align-items:center;cursor:pointer}
.sheet .in{margin:6px 0;font-size:17px}
.it.im{padding:0;overflow:hidden;justify-content:flex-end;min-height:124px;color:#fff}
.it.im .ph{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover}
.it.im span,.it.im small{position:relative;width:100%;padding:3px 8px;background:rgba(10,20,28,.62);color:#fff}
.it.im i{z-index:2}
@media (min-width:1400px){.it.im{min-height:150px}}
@media print{body>*:not(#modal){display:none!important}.ov{position:static;display:block;background:none}.sheet{max-width:none;max-height:none;overflow:visible;padding:0;background:#fff}.sheet>*:not(.qrs){display:none}}
.dine{padding:8px 0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.go.alt{background:transparent;color:var(--blue);border:2px solid var(--blue)}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
#tabs{display:none;flex:none;background:var(--surf);border-top:1px solid var(--line)}
#tabs button{flex:1;min-height:58px;border:0;background:transparent;font-size:16px}
#tabs .on{color:var(--blue);font-weight:700;box-shadow:inset 0 3px var(--blue)}
.ov{position:fixed;top:0;left:0;right:0;bottom:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.5)}
.sheet{width:100%;max-width:480px;max-height:92%;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--surf);border-radius:16px 16px 0 0}
.sheet p{margin:8px 0;color:var(--mute)}
.rc{display:flex;justify-content:space-between;padding:4px 0}
.hr{border-top:1px dashed var(--line);margin:8px 0}
@media (min-width:900px){.ov{align-items:center}.sheet{border-radius:16px}}
@media (max-width:899px){
 main{grid-template-columns:1fr}
 .panel:not(.on){display:none}
 #tabs{display:flex}
 #tables{grid-template-columns:repeat(2,1fr)}
 #items{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
}
</style>
</head>
<body>
<div id="app">
 <header><div class="brand"><b>Blue House Café</b><small>POS v1.0</small></div><div class="hb"><button id="bQr">ออเดอร์ QR<i id="qn"></i></button><button id="bGen">QR โต๊ะ</button><button id="bSum">ยอดวันนี้</button><button id="bAdm">จัดการเมนู</button></div></header>
 <main>
  <section class="panel" id="p-tables"><div id="tables"></div></section>
  <section class="panel" id="p-menu"><div id="cats"><select id="catSel" aria-label="หมวด"></select><input id="q" type="search" placeholder="ค้นหาเมนู"></div><div id="items"></div></section>
  <section class="panel" id="p-bill"><div id="billhead"></div><div id="lines"></div><div id="totals"></div></section>
 </main>
 <nav id="tabs"><button data-p="tables">โต๊ะ</button><button data-p="menu">เมนู</button><button data-p="bill">บิล</button></nav>
 </div>
<div id="cust"><header><div class="brand"><b>Blue House Café</b></div><b id="cT"></b></header>
 <div id="cCats"><select id="cSel" aria-label="หมวด"></select><input id="cQ" type="search" placeholder="ค้นหาเมนู"></div>
 <div id="cItems"></div><button class="go" id="cBar" disabled></button></div>
<div id="adm"><header><div class="brand"><b>จัดการเมนู</b></div><button id="aBack">กลับ POS</button></header><div id="aBody"></div></div>
<div id="toast"></div><div id="modal"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
// ===== เมนูตัวอย่าง: แก้ชื่อ/ราคาตรงนี้ได้เลย [หมวด, ชื่อ, ราคา] =====
const SWEET=['ไม่หวาน','หวานน้อย','ปกติ','หวานมาก'];
// เมนูสำรองในไฟล์ (ใช้เมื่อโหลด menu.json ไม่ได้) แก้เมนูจริงที่ไฟล์ menu.json
const DEF={"cats":["กาแฟ","มัทฉะ","ขนม","อื่นๆ"],"items":[["m01",0,"aerocano",75],["m02",0,"coconut latte",90],["m03",0,"dirty",85],["m04",0,"Einspanner latte",90],["m05",0,"flatwhite",75],["m06",0,"กาแฟซิง",80],["m07",0,"กาแฟน้ำส้มสด",85],["m08",0,"กาแฟพีช",85],["m09",0,"กาแฟมะพร้าว",85],["m10",0,"กาแฟมะพร้าวปั่น",90],["m11",0,"กาแฟมิ๊กเบอร์รี่",90],["m12",1,"Blue matcha latte",95],["m13",1,"Einspanner matcha latte",105],["m14",1,"Matcha",75],["m15",1,"yame",95],["m16",1,"บลูเบอร์รี่มัทฉะ",95],["m17",1,"มัทฉะส้มสด",90],["m18",1,"มัทฉะคาราเมล",90],["m19",1,"มัทฉะถั่วแดง",85],["m20",1,"มัทฉะน้ำผึ้ง",85],["m21",1,"มัทฉะน้ำผึ้งมะนาว",90],["m22",1,"มัทฉะน้ำมะพร้าว",90],["m23",1,"มัทฉะมะพร้าวปั่น",95],["m24",1,"มัทฉะยูสุ",90],["m25",1,"มัทฉะลาเต้",85],["m26",1,"มัทฉะลาเต้ (นมโอ๊ต)",95],["m27",1,"มัทฉะสตรอว์เบอร์รี่",95],["m28",1,"มัทฉะโกโก้",90],["m29",1,"เพียวมัทฉะ",80],["m30",1,"โฟมมัทฉะน้ำมะพร้าว",95],["m31",1,"ไฮจิฉะ",85],["m32",2,"chocolate cake",90],["m33",2,"New york cheesecake",95],["m34",2,"กล้วยหนีบธัญพืช",60],["m35",2,"กล้วยหนีบนูเทลล่า",65],["m36",3,"นมสด",50],["m37",3,"ชาใต้",55]]};
let CATS=[],MENU=[],MX={};
const MI=id=>MX[id];
function setMenu(j){CATS=j.cats;MENU=j.items.map(x=>({id:String(x[0]),c:+x[1],n:String(x[2]).replace(/[<>]/g,'').replace(/&/g,'&amp;'),p:+x[3],img:String(x[4]||'')}));MX={};MENU.forEach(m=>MX[m.id]=m)}
setMenu(DEF);
// ===== ระบบ =====
const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
const K='bhc_pos_v09', TB=['1','2','3','4','5','6','T'];
const fmt=n=>'฿'+Math.round(n).toLocaleString('en-US');
const tname=t=>t==='T'?'กลับบ้าน':'โต๊ะ '+t;
const today=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const hhmm=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const no4=n=>String(n).padStart(4,'0');
let S={orders:{},disc:{},bills:[],seq:1};
try{const r=JSON.parse(localStorage.getItem(K));if(r&&r.orders)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
let cur='1',cat=-1,tab='menu',qs='';
const dine=t=>(S.dine&&S.dine[t])||(t==='T'?'take':'in');
const L=t=>(S.orders[t]||[]).filter(l=>MI(l.id));
const sub=t=>L(t).reduce((s,l)=>s+MI(l.id).p*l.q,0);
const dsc=t=>Math.round(sub(t)*(S.disc[t]||0)/100);
const tot=t=>sub(t)-dsc(t);
const cnt=t=>L(t).reduce((s,l)=>s+l.q,0);

function add(t,id,d,m){
 const a=S.orders[t]=S.orders[t]||[], l=a.find(x=>x.id===id&&(x.m||'')===(m||''));
 if(l){l.q+=d;if(l.q<=0)a.splice(a.indexOf(l),1)}else if(d>0)a.push({id,q:d,m:m||''});
 if(!a.length){delete S.orders[t];delete S.disc[t];if(S.dine)delete S.dine[t];if(S.open)delete S.open[t]}
 save();render();
}
function toast(x){const e=$('#toast');e.textContent=x;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,1800)}
function pick(id,cb){
 const m=MI(id);let s='ปกติ';
 const draw=()=>{
  modal(`<div class="row"><b>${m.n}</b><button class="ghost" id="x">ปิด</button></div><p>ความหวาน</p><div class="chips">${SWEET.map(v=>`<button class="chip ${v===s?'on':''}" data-s="${v}">${v}</button>`).join('')}</div><button class="go" id="ok" style="margin-top:16px">เพิ่มลงบิล · ${fmt(m.p)}</button>`);
  $('#x').onclick=()=>modal('');
  $$('[data-s]').forEach(b=>b.onclick=()=>{s=b.dataset.s;draw()});
  $('#ok').onclick=()=>{cb?cb(id,s):add(cur,id,1,s);modal('')};
 };
 draw();
}
function setTab(x){tab=x;$$('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+x));$$('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===x))}
function modal(h){$('#modal').innerHTML=h?'<div class="ov"><div class="sheet">'+h+'</div></div>':''}

function render(){
 $('#tables').innerHTML=TB.map(t=>`<button class="tb ${t===cur?'sel':''} ${cnt(t)?'busy':''}" data-t="${t}"><b>${tname(t)}</b><span>${cnt(t)?fmt(tot(t)):'ว่าง'}</span></button>`).join('');
 const mine={};L(cur).forEach(l=>mine[l.id]=(mine[l.id]||0)+l.q);
 $('#items').innerHTML=MENU.filter(m=>qs?m.n.toLowerCase().includes(qs):(cat<0||m.c===cat)).map(m=>tile(m,'data-i',mine[m.id])).join('');
 const ls=L(cur), n=tot(cur);
 $('#billhead').innerHTML=`<b>${tname(cur)}</b><button class="ghost" id="bClr" ${ls.length?'':'disabled'}>ล้างบิล</button>`;
 $('#lines').innerHTML=ls.length?`<div class="dine chips">${[['in','เสริฟในร้าน'],['take','กลับบ้าน']].map(([k,v])=>`<button class="chip ${dine(cur)===k?'on':''}" data-dn="${k}">${v}</button>`).join('')}</div>`+ls.map((l,k)=>{const m=MI(l.id);return `<div class="ln"><div>${m.n}<small>${l.m?l.m+' · ':''}${fmt(m.p)}</small></div><div class="qty"><button data-a="-1" data-k="${k}" aria-label="ลด">−</button><b>${l.q}</b><button data-a="1" data-k="${k}" aria-label="เพิ่ม">+</button></div><div class="lt">${fmt(m.p*l.q)}</div></div>`}).join(''):'<div class="empty">ยังไม่มีรายการ แตะเมนูเพื่อเพิ่ม</div>';
 $('#totals').innerHTML=`<div class="row"><span>รวม</span><span>${fmt(sub(cur))}</span></div>
 <div class="row"><span>ส่วนลด</span><div class="chips">${[0,5,10,20].map(d=>`<button class="chip ${(S.disc[cur]||0)===d?'on':''}" data-d="${d}">${d?d+'%':'ไม่มี'}</button>`).join('')}</div></div>
 <div class="row"><span>สุทธิ</span><span class="net">${fmt(n)}</span></div>
 <div class="row2"><button class="go" id="bSave" ${n?'':'disabled'}>${S.open&&S.open[cur]?'บันทึก':'เปิดตั๋ว'}</button><button class="go alt" id="bPay" ${n?'':'disabled'}>ชำระเงิน</button></div>`;
 const bt=$('#tabs [data-p="bill"]');bt.textContent=cnt(cur)?'บิล ('+cnt(cur)+')':'บิล';
}

document.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.t){cur=b.dataset.t;setTab('menu');render()}
 else if(b.dataset.c){cat=+b.dataset.c;render()}
 else if(b.dataset.a){const l=L(cur)[+b.dataset.k];if(l)add(cur,l.id,+b.dataset.a,l.m)}
 else if(b.dataset.dn){(S.dine=S.dine||{})[cur]=b.dataset.dn;save();render()}
 else if(b.id==='bSave'){(S.open=S.open||{})[cur]=true;save();toast('บันทึก '+tname(cur)+' แล้ว');if(innerWidth<900)setTab('tables');render()}
 else if(b.dataset.i&&b.classList.contains('it')){pick(b.dataset.i)}
 else if(b.dataset.d!==undefined){S.disc[cur]=+b.dataset.d;save();render()}
 else if(b.dataset.p){setTab(b.dataset.p)}
 else if(b.id==='bClr'){delete S.orders[cur];delete S.disc[cur];if(S.dine)delete S.dine[cur];if(S.open)delete S.open[cur];save();render()}
 else if(b.id==='bPay'){pay()}
 else if(b.id==='bSum'){summary()}
 else if(b.id==='bQr'){poll().then(inbox)}
 else if(b.id==='bGen'){gen()}
 else if(b.id==='bAdm'){location.hash='admin'}
});
$('#modal').addEventListener('click',e=>{if(e.target.classList.contains('ov'))modal('')});

function pay(){
 const t=cur,n=tot(t);if(!n)return;
 let m='cash',got=n;

  modal(`<div class="row"><b>ชำระเงิน · ${tname(t)}</b><button class="ghost" id="x">ปิด</button></div>

  };
 };
 draw();
}

  for(let n=1;n<=6;n++){
   const c=document.createElement('div');c.className='qc';c.innerHTML='<div class="qq"></div><b>โต๊ะ '+n+'</b><small>สแกนเพื่อสั่งเครื่องดื่ม</small>';el.appendChild(c);
   if(window.QRCode)new QRCode(c.firstChild,{text:base()+'#t'+n,width:150,height:150,colorDark:'#000000',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});
   else c.firstChild.textContent='ต้องต่ออินเทอร์เน็ตเพื่อสร้าง QR';
  }
 };
 modal(`<div class="row"><b>QR สั่งเครื่องดื่ม 6 โต๊ะ</b><button class="ghost" id="x">ปิด</button></div><p>ลิงก์หน้าสั่งของลูกค้า (ลูกค้าต้องเปิดจากมือถือตัวเองได้)${/localhost|^file:/.test(base())?' ตอนนี้ยังเป็นลิงก์ในเครื่อง ให้ใส่ลิงก์เว็บจริงก่อนพิมพ์':''}</p><input class="in" id="base" style="font-size:15px" value="${esc(base())}"><div class="qrs" id="qrs"></div><button class="go" id="pr" style="margin-top:12px">พิมพ์ QR</button>`);
 $('#x').onclick=()=>modal('');
 $('#base').oninput=e=>{S.base=e.target.value.trim();save();draw()};
 $('#pr').onclick=()=>print();
 draw();
}
// ===== ฝั่งลูกค้า (เปิดจาก QR: #t1 ถึง #t6) =====
const TNO=(location.hash.match(/^#t([1-6])$/)||[])[1];
let cart=[],cc=-1,cq='',note='';
const ctot=()=>cart.reduce((s,l)=>s+MI(l.id).p*l.q,0), ccnt=()=>cart.reduce((s,l)=>s+l.q,0);
function cartAdd(id,m,d){const l=cart.find(x=>x.id===id&&x.m===m);if(l){l.q+=d;if(l.q<=0)cart.splice(cart.indexOf(l),1)}else if(d>0)cart.push({id,q:d,m});cRender()}
function cRender(){
 $('#cItems').innerHTML=MENU.filter(m=>cq?m.n.toLowerCase().includes(cq):(cc<0||m.c===cc)).map(m=>tile(m,'data-ci',cart.filter(l=>l.id===m.id).reduce((s,l)=>s+l.q,0))).join('');
 $('#cBar').textContent=ccnt()?`ตะกร้า · ${ccnt()} รายการ · ${fmt(ctot())}`:'เลือกเมนูเพื่อเริ่มสั่ง';$('#cBar').disabled=!ccnt();
}
function cartView(){
 const draw=()=>{
  if(!cart.length){modal('');return}
  modal(`<div class="row"><b>ตะกร้า · โต๊ะ ${TNO}</b><button class="ghost" id="x">ปิด</button></div>${cart.map((l,k)=>{const m=MI(l.id);return `<div class="ln"><div>${m.n}<small>${l.m} · ${fmt(m.p)}</small></div><div class="qty"><button data-ck="${k}" data-cd="-1" aria-label="ลด">−</button><b>${l.q}</b><button data-ck="${k}" data-cd="1" aria-label="เพิ่ม">+</button></div><div class="lt">${fmt(m.p*l.q)}</div></div>`}).join('')}<input class="in" id="nt" placeholder="หมายเหตุถึงร้าน (ไม่บังคับ)" value="${esc(note)}" style="font-size:16px;margin:10px 0"><div class="row"><span>รวม</span><b class="net">${fmt(ctot())}</b></div><p>ชำระเงินที่เคาน์เตอร์</p><button class="go" id="snd">ส่งออเดอร์</button>`);
  $('#x').onclick=()=>modal('');
  $('#nt').oninput=e=>note=e.target.value.slice(0,120);
  $$('[data-ck]').forEach(b=>b.onclick=()=>{const l=cart[+b.dataset.ck];cartAdd(l.id,l.m,+b.dataset.cd);draw()});
  $('#snd').onclick=async()=>{
   const o={id:uid(),table_no:+TNO,items:cart.map(l=>({id:l.id,n:MI(l.id).n,p:MI(l.id).p,q:l.q,s:l.m})),note,total:ctot(),status:'new',created_at:new Date().toISOString()};
   $('#snd').disabled=true;
   try{await DB.send(o)}catch(e){$('#snd').disabled=false;toast('ส่งไม่สำเร็จ ลองอีกครั้ง');return}
   cart=[];note='';cRender();sent(o.id);
  };
 };
 draw();
}
function sent(id){
 const msg={new:'ส่งออเดอร์แล้ว รอร้านยืนยัน…',accepted:'ร้านรับออเดอร์แล้ว กำลังเตรียมเครื่องดื่ม',rejected:'ขออภัย ร้านรับออเดอร์นี้ไม่ได้ กรุณาเรียกพนักงาน'};
 let h;
 const draw=s=>{modal(`<b>ออเดอร์ #${id.slice(0,4).toUpperCase()} · โต๊ะ ${TNO}</b><p>${msg[s]||msg.new}</p><button class="go" id="more">สั่งเพิ่ม</button>`);$('#more').onclick=()=>{clearInterval(h);modal('')}};
 draw('new');
 h=setInterval(async()=>{try{const s=await DB.status(id);if(s&&s!=='new'){clearInterval(h);draw(s)}}catch(e){}},4000);
 setTimeout(()=>clearInterval(h),1800000);
}
// จุดเชื่อม QR order: POS.addOrder('3',[['ลาเต้',2],['บราวนี่',1]])
window.POS={version:'0.7',addOrder(t,items){(items||[]).forEach(([n,q])=>{const m=MENU.find(x=>x.n===n);if(m&&TB.includes(String(t)))add(String(t),m.id,q||1)})}};

function boot(){
addEventListener('hashchange',()=>location.reload());
$('#catSel').innerHTML=['รายการทั้งหมด'].concat(CATS).map((c,i)=>`<option value="${i-1}">${c}</option>`).join('');
$('#catSel').onchange=e=>{cat=+e.target.value;qs='';$('#q').value='';render()};
$('#q').oninput=e=>{qs=e.target.value.trim().toLowerCase();render()};
setTab('menu');render();
if(TNO){
 $('#cT').textContent='โต๊ะ '+TNO;
 $('#cSel').innerHTML=['รายการทั้งหมด'].concat(CATS).map((c,i)=>`<option value="${i-1}">${c}</option>`).join('');
 $('#cSel').onchange=e=>{cc=+e.target.value;cq='';$('#cQ').value='';cRender()};
 $('#cQ').oninput=e=>{cq=e.target.value.trim().toLowerCase();cRender()};
 $('#cust').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.ci)pick(b.dataset.ci,(id,s)=>cartAdd(id,s,1));else if(b.id==='cBar')cartView()});
 cRender();
 addEventListener('hashchange',()=>location.reload());
}else if(ADM){adminInit()}else{poll();setInterval(poll,4000)}
}
Promise.race([loadMenu(),new Promise(r=>setTimeout(r,4000))]).then(boot);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
